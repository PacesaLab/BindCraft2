<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="Open Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A7178"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9740C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="320" fill="#FFFFFF"/>

  <!-- ============ Main 4-stage flow ============ -->
  <!-- Box 1: Trajectory -->
  <g>
    <rect x="20" y="20" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#37939B" stroke-width="2"/>
    <circle cx="48" cy="20" r="15" fill="#37939B"/>
    <text x="48" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="115" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Trajectory</text>
    <text x="115" y="73" text-anchor="middle" font-size="12.5" font-style="italic" fill="#37939B">hallucination</text>
    <line x1="35" y1="83" x2="195" y2="83" stroke="#E1E6E8" stroke-width="1"/>
    <text x="115" y="102" text-anchor="middle" font-size="12" fill="#444444">Complex predicted by</text>
    <text x="115" y="118" text-anchor="middle" font-size="12" fill="#444444">reversing AlphaFold.</text>
  </g>

  <line x1="212" y1="95" x2="260" y2="95" stroke="#2A7178" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Box 2: Redesign -->
  <g>
    <rect x="262" y="20" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#37939B" stroke-width="2"/>
    <circle cx="290" cy="20" r="15" fill="#37939B"/>
    <text x="290" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="357" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Redesign</text>
    <text x="357" y="73" text-anchor="middle" font-size="12.5" font-style="italic" fill="#37939B">ProteinMPNN</text>
    <line x1="277" y1="83" x2="437" y2="83" stroke="#E1E6E8" stroke-width="1"/>
    <text x="357" y="102" text-anchor="middle" font-size="12" fill="#444444">New sequences drawn</text>
    <text x="357" y="118" text-anchor="middle" font-size="12" fill="#444444">for that backbone.</text>
  </g>

  <line x1="454" y1="95" x2="502" y2="95" stroke="#2A7178" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Box 3: Validation refold -->
  <g>
    <rect x="504" y="20" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#37939B" stroke-width="2"/>
    <circle cx="532" cy="20" r="15" fill="#37939B"/>
    <text x="532" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="599" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Validation refold</text>
    <text x="599" y="73" text-anchor="middle" font-size="12.5" font-style="italic" fill="#37939B">AlphaFold</text>
    <line x1="519" y1="83" x2="679" y2="83" stroke="#E1E6E8" stroke-width="1"/>
    <text x="599" y="102" text-anchor="middle" font-size="12" fill="#444444">Test if the sequence folds</text>
    <text x="599" y="118" text-anchor="middle" font-size="12" fill="#444444">and binds. Apply Filters.</text>
  </g>

  <line x1="696" y1="95" x2="744" y2="95" stroke="#2A7178" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Box 4: Ranking -->
  <g>
    <rect x="746" y="20" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#37939B" stroke-width="2"/>
    <circle cx="774" cy="20" r="15" fill="#37939B"/>
    <text x="774" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="841" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Ranking</text>
    <text x="841" y="73" text-anchor="middle" font-size="12.5" font-style="italic" fill="#37939B">i_pDAE</text>
    <line x1="761" y1="83" x2="921" y2="83" stroke="#E1E6E8" stroke-width="1"/>
    <text x="841" y="102" text-anchor="middle" font-size="12" fill="#444444">Passing designs sorted</text>
    <text x="841" y="118" text-anchor="middle" font-size="12" fill="#444444">by best-first.</text>
  </g>

  <!-- ============ Connector into stage-1 zoom ============ -->
  <line x1="115" y1="141" x2="115" y2="182" stroke="#D9740C" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrow-orange)"/>

  <!-- ============ Stage 1 zoom: the trajectory sub-stages ============ -->
  <rect x="20" y="186" width="610" height="118" rx="14" fill="#FDF1E4" stroke="#D9740C" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="38" y="208" font-size="13" font-weight="700" fill="#B85C00">Within stage 1:</text>

  <g font-size="13" font-weight="700" fill="#7A3D00">
    <rect x="60" y="222" width="90" height="48" rx="10" fill="#FFFFFF" stroke="#D9740C" stroke-width="1.5"/>
    <text x="105" y="250" text-anchor="middle">screen</text>

    <line x1="150" y1="246" x2="168" y2="246" stroke="#D9740C" stroke-width="2" marker-end="url(#arrow-orange)"/>

    <rect x="170" y="222" width="90" height="48" rx="10" fill="#FFFFFF" stroke="#D9740C" stroke-width="1.5"/>
    <text x="215" y="250" text-anchor="middle">refine</text>

    <line x1="260" y1="246" x2="278" y2="246" stroke="#D9740C" stroke-width="2" marker-end="url(#arrow-orange)"/>

    <rect x="280" y="222" width="90" height="48" rx="10" fill="#FFFFFF" stroke="#D9740C" stroke-width="1.5"/>
    <text x="325" y="250" text-anchor="middle">anneal</text>

    <line x1="370" y1="246" x2="388" y2="246" stroke="#D9740C" stroke-width="2" marker-end="url(#arrow-orange)"/>

    <rect x="390" y="222" width="90" height="48" rx="10" fill="#FFFFFF" stroke="#D9740C" stroke-width="1.5"/>
    <text x="435" y="250" text-anchor="middle">harden</text>

    <line x1="480" y1="246" x2="498" y2="246" stroke="#D9740C" stroke-width="2" marker-end="url(#arrow-orange)"/>

    <rect x="500" y="222" width="90" height="48" rx="10" fill="#FFFFFF" stroke="#D9740C" stroke-width="1.5"/>
    <text x="545" y="250" text-anchor="middle">mutate</text>
  </g>

  <text x="38" y="290" font-size="11.5" fill="#7A3D00">Each stage has a confidence floor; a trajectory that can't meet it is dropped early.</text>
</svg>
